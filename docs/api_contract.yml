openapi: 3.0.3
info:
  title: AI Social Platform API
  version: 1.0.0
  description: REST API for account linking, chatbot content, scheduling, and automated posting.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Health probe
      responses:
        "200":
          description: OK

  /auth/login:
    post:
      summary: Login and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: JWT issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string }

  /oauth/linkedin/start:
    get:
      summary: Start LinkedIn OAuth
      responses:
        "302":
          description: Redirect to LinkedIn

  /oauth/linkedin/callback:
    get:
      summary: LinkedIn OAuth callback
      parameters:
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
      responses:
        "200":
          description: LinkedIn account linked

  /oauth/twitter/start:
    get:
      summary: Start Twitter OAuth (if using official API)
      responses:
        "302":
          description: Redirect to Twitter

  /oauth/twitter/callback:
    get:
      summary: Twitter OAuth callback
      parameters:
        - in: query
          name: oauth_token
          schema: { type: string }
        - in: query
          name: oauth_verifier
          schema: { type: string }
      responses:
        "200":
          description: Twitter account linked

  /chatbot/suggest:
    post:
      summary: Generate content suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatPrompt"
      responses:
        "200":
          description: Suggestions generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatSuggestion"

  /posts:
    get:
      summary: List posts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      summary: Create draft post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /schedule:
    post:
      summary: Schedule a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequest"
      responses:
        "201":
          description: Scheduled

  /automation/publish:
    post:
      summary: Trigger immediate publish (admin/test)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post_id, platform]
              properties:
                post_id: { type: string }
                platform:
                  type: string
                  enum: [twitter, linkedin, instagram]
      responses:
        "202":
          description: Enqueued

components:
  schemas:
    ChatPrompt:
      type: object
      required: [business, tone, topic]
      properties:
        business: { type: string }
        tone: { type: string }
        topic: { type: string }
        hashtags: { type: array, items: { type: string } }

    ChatSuggestion:
      type: object
      properties:
        text: { type: string }
        platform_tips: { type: string }

    Post:
      type: object
      properties:
        id: { type: string }
        platform: { type: string, enum: [twitter, linkedin, instagram] }
        content: { type: string }
        media_url: { type: string, nullable: true }
        status: { type: string, enum: [draft, scheduled, published, failed] }
        scheduled_at: { type: string, format: date-time, nullable: true }

    PostCreate:
      type: object
      required: [platform, content]
      properties:
        platform: { type: string, enum: [twitter, linkedin, instagram] }
        content: { type: string }
        media_url: { type: string, nullable: true }

    ScheduleRequest:
      type: object
      required: [post_id, scheduled_at, timezone]
      properties:
        post_id: { type: string }
        scheduled_at: { type: string, format: date-time }
        timezone: { type: string }
